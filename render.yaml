services:
  - type: web
    runtime: static
    name: lk-digital-tools
    repo: https://github.com/LK-Digital-Tools/LK-Digital-Tools.github.io
    branch: main
    buildCommand: echo "Static site - no build required"
    staticPublishPath: .
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=86400
